name: tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyflakes
      - run: python -m pyflakes claimcheck_core/rules.py claimcheck_core/vision.py claimcheck_core/take.py claimcheck_core/director.py claimcheck_core/finishing.py
      - run: python -m pytest -q tests
